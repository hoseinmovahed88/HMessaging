name: Build APK

on:
  push:
    branches:
      - claude/android-messenger-app-izbr89
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The secrets context cannot be read from a step-level `if`, so the presence
    # check is hoisted into a job-level env var.
    env:
      HAS_SIGNING_KEY: ${{ secrets.HM_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Signing is optional: without these secrets the job still produces an
      # unsigned release APK, which keeps the build usable on a fork.
      - name: Restore signing keystore
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.HM_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          HM_KEYSTORE_PASSWORD: ${{ secrets.HM_KEYSTORE_PASSWORD }}
          HM_KEY_ALIAS: ${{ secrets.HM_KEY_ALIAS }}
          HM_KEY_PASSWORD: ${{ secrets.HM_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Actions log downloads are served from a storage host some networks cannot reach, which
      # leaves a failed build with no readable reason. The errors are pushed to a branch instead,
      # for the same reason the APK is: a branch is fetchable over plain git.
      - name: Publish the build log on failure
        if: failure()
        run: |
          set -eu
          staging=$(mktemp -d)
          grep -E "^e: |^w: |FAILURE:|What went wrong|Caused by:|error:" "$RUNNER_TEMP/build.log" \
            > "$staging/errors.txt" || true
          tail -400 "$RUNNER_TEMP/build.log" > "$staging/tail.txt"
          cd "$staging"
          git init -q
          git checkout -q -b build-log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Build log for ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            build-log

      - name: Report what was built
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hmessaging-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts are served from a storage host some networks cannot reach, so the
      # APK is also force-pushed to a throwaway branch that is fetchable over plain git.
      - name: Publish APK to the build-apk branch
        run: |
          set -eu
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          staging=$(mktemp -d)
          cp "$apk" "$staging/$(basename "$apk")"
          cd "$staging"
          git init -q
          git checkout -q -b build-apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "APK from run ${{ github.run_number }} (${{ github.sha }})"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            build-apk
