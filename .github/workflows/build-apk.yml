name: Build APK

on:
  push:
    branches:
      - claude/android-messenger-app-izbr89
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The secrets context cannot be read from a step-level `if`, so the presence
    # check is hoisted into a job-level env var.
    env:
      HAS_SIGNING_KEY: ${{ secrets.HM_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages` is set explicitly because the action's default list includes the
      # obsolete `tools` package, which Google has withdrawn from the SDK repository:
      # sdkmanager now answers "Failed to find package 'tools'" and exits 1, failing
      # the job before anything is compiled. Nothing here needs it — the Gradle plugin
      # fetches the platform and build-tools the project asks for.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Signing is optional: without these secrets the job still produces an
      # unsigned release APK, which keeps the build usable on a fork.
      - name: Restore signing keystore
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.HM_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          HM_KEYSTORE_PASSWORD: ${{ secrets.HM_KEYSTORE_PASSWORD }}
          HM_KEY_ALIAS: ${{ secrets.HM_KEY_ALIAS }}
          HM_KEY_PASSWORD: ${{ secrets.HM_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Actions log downloads are served from a storage host some networks cannot reach, which
      # leaves a failed build with no readable reason. The errors are pushed to a branch instead,
      # for the same reason the APK is: a branch is fetchable over plain git.
      #
      # Nothing in here may fail the job or mask the real error, so every command is guarded and
      # the step reports success regardless of what it managed to collect.
      - name: Publish the build log
        if: always()
        continue-on-error: true
        run: |
          staging=$(mktemp -d) || exit 0
          cp "$RUNNER_TEMP/build.log" "$staging/full.log" 2>/dev/null || echo "no build.log" > "$staging/full.log"
          grep -E "^e: |FAILURE:|What went wrong|Caused by:|error:|Execution failed" "$staging/full.log" > "$staging/errors.txt" 2>/dev/null || true
          [ -s "$staging/errors.txt" ] || echo "no matching lines" > "$staging/errors.txt"
          tail -c 400000 "$staging/full.log" > "$staging/tail.log" 2>/dev/null || true
          rm -f "$staging/full.log"
          echo "${{ github.sha }} ${{ job.status }}" > "$staging/about.txt"
          cd "$staging" || exit 0
          git init -q . || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -B build-log
          git add -A
          git commit -q -m "Build log for ${{ github.sha }}" || exit 0
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log || echo "push failed"

      - name: Report what was built
        run: ls -lh app/build/outputs/apk/release/

      # The APK is NOT uploaded as an Actions artifact. It was, and the account's artifact
      # storage filled up: every build left a 2.5 MB copy for thirty days, and once the quota
      # was reached the upload step failed and took a perfectly good build down with it —
      # BUILD SUCCESSFUL in the log, no APK anywhere. The branch push below already delivers
      # it, over plain git, from a host that is reachable here; a second copy behind a quota
      # was only ever a way to lose builds.

      - name: Publish APK to the build-apk branch
        run: |
          set -eu
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          staging=$(mktemp -d)
          cp "$apk" "$staging/$(basename "$apk")"
          cd "$staging"
          git init -q
          git checkout -q -b build-apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "APK from run ${{ github.run_number }} (${{ github.sha }})"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            build-apk
